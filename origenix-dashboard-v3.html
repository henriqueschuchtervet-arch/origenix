<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Gestão Regulatória | ORIGENIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" defer></script>
  <script src="/assets/js/config.js" defer></script>
  <script src="/assets/js/core.js" defer></script>
  <script src="/assets/js/dashboard.js" defer></script>
</head>
<body>
  <div class="app-shell" id="appShell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="/" aria-label="ORIGENIX">ORIGENI<b>X</b></a>
        <button class="button button-quiet button-small mobile-menu" id="closeMenu" type="button" aria-label="Fechar menu">×</button>
      </div>
      <nav class="sidebar-nav" id="mainNav" aria-label="Módulos">
        <button class="nav-item" data-module="overview" aria-current="page">Visão geral</button>
        <button class="nav-item" data-module="empresas">Estabelecimentos</button>
        <button class="nav-item" data-module="projetos">Projetos sanitários</button>
        <button class="nav-item" data-module="documentos">Documentos</button>
        <button class="nav-item" data-module="rts">Responsáveis técnicos</button>
        <button class="nav-item" data-module="licencas">Licenças e ARTs</button>
        <button class="nav-item" data-module="auditorias">Auditorias</button>
        <button class="nav-item" data-module="leads" data-roles="admin">Leads</button>
        <button class="nav-item" data-module="faturamento" data-roles="admin,consultor">Faturamento</button>
        <button class="nav-item" data-module="access_requests" data-roles="admin">Solicitações de acesso</button>
      </nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="avatar" id="userAvatar">OX</div>
          <div><strong id="userName">Carregando</strong><span id="userRole">—</span></div>
        </div>
        <button class="button button-quiet" id="logoutButton" type="button" style="width:100%">Sair</button>
      </div>
    </aside>

    <main class="app-main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:.75rem">
          <button class="button button-quiet mobile-menu" id="openMenu" type="button" aria-label="Abrir menu">☰</button>
          <div class="topbar-title"><strong id="topbarModule">Visão geral</strong><span id="currentDate">—</span></div>
        </div>
        <a class="button button-small" href="/origenix-emissao-v3.html">Central de documentos</a>
      </header>
      <section class="page" id="pageContent" aria-live="polite">
        <div class="loading">Validando acesso seguro...</div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="recordModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="recordModalTitle">
      <header class="modal-head">
        <h2 id="recordModalTitle">Registro</h2>
        <button class="button button-quiet button-small" type="button" data-close-modal aria-label="Fechar">×</button>
      </header>
      <div class="modal-body">
        <form id="recordForm" novalidate></form>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="inviteModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="inviteModalTitle">
      <header class="modal-head">
        <h2 id="inviteModalTitle">Aprovar e convidar</h2>
        <button class="button button-quiet button-small" type="button" data-close-invite aria-label="Fechar">×</button>
      </header>
      <div class="modal-body">
        <form id="inviteForm" class="auth-form">
          <input type="hidden" id="inviteRequestId">
          <div class="notice notice-info">O convite é enviado por uma função protegida. A chave administrativa nunca chega ao navegador.</div>
          <div class="field"><label for="inviteRole">Papel</label><select id="inviteRole" required><option value="cliente">Cliente</option><option value="colaborador">Colaborador</option><option value="consultor">Consultor</option><option value="rt">Responsável técnico</option></select></div>
          <div class="field"><label for="inviteCompany">Estabelecimento</label><select id="inviteCompany"><option value="">Sem vínculo inicial</option></select><span class="field-hint">Clientes devem ser vinculados à empresa que poderão consultar.</span></div>
          <div class="form-actions"><button class="button" type="button" data-close-invite>Cancelar</button><button class="button button-primary" id="inviteSubmit" type="submit">Enviar convite</button></div>
        </form>
      </div>
    </section>
  </div>
</body>
</html>
