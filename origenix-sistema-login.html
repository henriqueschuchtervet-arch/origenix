<!DOCTYPE html>
<html lang="pt-BR" style="background:#000;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIGENIX — Sistema Funcional (Cadastro e Emissão)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --black:#000000; --graphite:#121214; --graphite-2:#1a1a1c;
    --metal:#a9a9a9; --silver:#e5e5e5; --white:#ffffff;
    --red:#d10000; --red-deep:#8b0000; --red-accent:#ff1a1a;
    --green:#3fae6a; --amber:#d19a1a;
    --line:rgba(255,45,45,0.25);
    --paper:#ffffff; --ink:#141414; --ink-dim:#6b6b6b; --hair:#dcdcdc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background-color:#000000;color:var(--white);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;min-height:100vh;}
  .orbitron{font-family:'Orbitron',sans-serif;text-transform:uppercase;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}
  :focus-visible{outline:1.5px solid var(--red-accent);outline-offset:2px;}

  .bg-layer{position:fixed;top:0;left:0;width:100%;height:100%;background:#000000;z-index:-1;}

  .panel{background:var(--graphite);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 0 rgba(255,255,255,0.05) inset, 0 18px 40px -20px rgba(0,0,0,0.9);}

  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}
  @media (max-width:900px){.app{grid-template-columns:1fr;}}

  .sidebar{margin:16px 0 16px 16px;padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:16px;height:fit-content;}
  @media (max-width:900px){.sidebar{margin:16px;position:static;}}
  .side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 24px;}
  .side-brand img{width:34px;height:34px;object-fit:contain;border-radius:50%;}
  .side-brand .name{font-family:'Orbitron';font-size:16px;font-weight:800;letter-spacing:1px;}
  .side-brand .name .x{color:var(--red-accent);}
  .side-nav{display:flex;flex-direction:column;gap:4px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:9px;font-size:13.5px;color:var(--metal);transition:.15s;font-family:'Montserrat';font-weight:500;}
  .nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--white);}
  .nav-item.active{background:linear-gradient(90deg, rgba(209,0,0,0.22), rgba(209,0,0,0.04));color:var(--white);box-shadow:inset 2px 0 0 var(--red-accent);}
  .nav-item .count{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:20px;padding:1px 7px;}

  .main{padding:16px;min-width:0;}
  .topbar{padding:20px 26px;margin-bottom:8px;}
  .topbar h1{font-family:'Orbitron';font-size:17px;font-weight:700;letter-spacing:.5px;}
  .topbar .sub{font-size:11.5px;color:var(--metal);margin-top:4px;font-family:'Montserrat';}

  .conn-status{margin:0 0 16px;padding:10px 26px;font-family:'Montserrat';font-size:11px;color:var(--metal);display:flex;align-items:center;gap:8px;}
  .conn-status .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0;}
  .conn-status.ok .dot{background:var(--green);}
  .conn-status.error .dot{background:var(--red-accent);}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{width:100%;max-width:380px;padding:32px 30px;}
  .login-tabs{display:flex;gap:8px;background:#0a0a0a;border-radius:9px;padding:4px;}
  .login-tab{flex:1;padding:10px;border-radius:7px;font-family:'Montserrat';font-weight:600;font-size:12.5px;color:var(--metal);}
  .login-tab.active{background:var(--red-accent);color:#fff;}
  .login-msg{margin-top:14px;font-family:'Montserrat';font-size:12px;text-align:center;color:var(--metal);min-height:16px;}
  .login-msg.error{color:var(--red-accent);}
  .login-msg.ok{color:var(--green);}

  .side-user{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  .side-user-email{font-family:'Montserrat';font-size:11px;color:var(--metal);word-break:break-all;padding:0 4px;}

  .content{padding:0 10px 50px;}

  .card{margin-bottom:16px;overflow:hidden;}
  .card-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);}
  .card-head h2{font-family:'Orbitron';font-size:12.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}

  .form-grid{padding:22px 24px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:700px){.form-grid{grid-template-columns:1fr;}}
  .f-item{display:flex;flex-direction:column;gap:7px;}
  .f-item.full{grid-column:1/-1;}
  .f-item label{font-family:'Montserrat';font-size:10.5px;color:var(--metal);letter-spacing:.5px;text-transform:uppercase;font-weight:600;}
  .f-item input, .f-item select{
    background:#0a0a0a;border:1px solid var(--line);border-radius:8px;padding:11px 13px;
    color:var(--white);font-size:13.5px;font-family:'Montserrat';
  }
  .f-item input::placeholder{color:#555;}
  .f-item input:focus, .f-item select:focus{border-color:var(--red-accent);}
  .form-actions{padding:0 24px 24px;display:flex;gap:12px;}
  .btn-primary{
    background:linear-gradient(135deg,var(--red-deep),var(--red-accent));color:#fff;
    padding:13px 26px;border-radius:9px;font-family:'Montserrat';font-weight:700;font-size:13px;
    box-shadow:0 10px 30px -14px rgba(209,0,0,0.7);
  }
  .btn-primary:disabled{opacity:0.5;}
  .btn-ghost{border:1px solid var(--line);color:var(--metal);padding:13px 22px;border-radius:9px;font-family:'Montserrat';font-weight:600;font-size:13px;}

  .client-row{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--line);}
  .client-row:last-child{border-bottom:none;}
  .client-row .info{flex:1;min-width:0;}
  .client-row .info b{font-size:13.5px;font-weight:600;display:block;}
  .client-row .info span{font-size:11.5px;color:var(--metal);font-family:'Montserrat';}
  .client-row .actions{display:flex;gap:8px;flex-shrink:0;}
  .mini-btn{border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-family:'Montserrat';font-size:11.5px;font-weight:600;color:var(--metal);}
  .mini-btn.emit{border-color:rgba(209,0,0,0.4);color:var(--red-accent);}
  .mini-btn:hover{background:rgba(255,255,255,0.05);}
  .empty-state{padding:50px 24px;text-align:center;color:var(--metal);font-family:'Montserrat';font-size:13px;}
  .client-tools{display:grid;grid-template-columns:minmax(220px,1fr) 190px auto;gap:10px;padding:16px 24px;border-bottom:1px solid var(--line);}
  .client-tools input,.client-tools select{width:100%;background:#09090a;color:var(--white);border:1px solid var(--line);border-radius:9px;padding:11px 13px;}
  .client-tools .btn-ghost{padding:10px 16px;white-space:nowrap;}
  .client-results-meta{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;color:var(--metal);font-family:'Montserrat';font-size:11.5px;border-bottom:1px solid rgba(255,255,255,.05);}
  .client-pagination{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--line);color:var(--metal);font-family:'Montserrat';font-size:11.5px;}
  .client-pagination span{min-width:110px;text-align:center;}
  .client-row.archived{opacity:.72;}
  .client-row .status-badge{display:inline-flex;margin-top:7px;padding:3px 8px;border-radius:999px;background:rgba(63,174,106,.12);color:#71d596;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
  .client-row.archived .status-badge{background:rgba(169,169,169,.12);color:var(--metal);}
  .mini-btn.edit{color:var(--white);}
  .mini-btn.danger{color:#ff7777;border-color:rgba(255,60,60,.35);}
  .mini-btn:disabled{opacity:.45;cursor:not-allowed;}
  @media (max-width:760px){
    .client-tools{grid-template-columns:1fr;}
    .client-row{align-items:flex-start;flex-direction:column;}
    .client-row .actions{width:100%;flex-wrap:wrap;}
    .client-row .actions .mini-btn{flex:1;min-width:110px;}
    .client-pagination{justify-content:center;flex-wrap:wrap;padding:14px;}
  }

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);
    background:var(--graphite-2);border:1px solid var(--green);color:var(--white);
    padding:14px 24px;border-radius:9px;font-family:'Montserrat';font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:10px;transition:transform .3s ease;z-index:100;max-width:80vw;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.error{border-color:var(--red-accent);}
  .toast svg{width:16px;height:16px;color:var(--green);flex-shrink:0;}
  .toast.error svg{color:var(--red-accent);}

  #docView{display:none;}
  .doc-toolbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;}
  .doc-toolbar .back{font-family:'Montserrat';font-size:12.5px;color:var(--metal);display:flex;align-items:center;gap:6px;cursor:pointer;}
  .doc-toolbar .print-btn{background:linear-gradient(135deg,var(--red-deep),var(--red-accent));color:#fff;padding:11px 22px;border-radius:8px;font-family:'Montserrat';font-weight:700;font-size:12.5px;}

  .page{width:210mm;min-height:297mm;margin:0 auto 20px;background:var(--paper);color:var(--ink);box-shadow:0 30px 70px -25px rgba(0,0,0,0.7);}
  .page-inner{padding:18mm 16mm 22mm;min-height:297mm;display:flex;flex-direction:column;}
  .cover{background:var(--black);color:#fff;}
  .cover .page-inner{justify-content:space-between;align-items:center;text-align:center;padding-top:34mm;padding-bottom:20mm;}
  .cover-mark{width:110px;height:110px;object-fit:cover;margin-bottom:22px;border-radius:50%;}
  .cover-brand{font-family:'Orbitron';font-size:14px;letter-spacing:4px;color:var(--metal);}
  .cover-brand .x{color:var(--red-accent);}
  .cover-rule{width:60px;height:2px;background:linear-gradient(90deg,var(--red-deep),var(--red-accent));margin:24px 0;}
  .cover-folder{font-family:'Montserrat';font-size:11px;letter-spacing:2px;color:var(--red-accent);text-transform:uppercase;}
  .cover h1{font-family:'Montserrat';font-weight:700;font-size:26px;max-width:130mm;line-height:1.35;margin-top:16px;text-transform:uppercase;}
  .cover .client{font-family:'Montserrat';font-size:13.5px;color:var(--silver);margin-top:20px;}
  .cover .client b{color:#fff;}
  .cover-meta{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,0.1);margin-top:auto;}
  .cover-meta div{background:#050505;padding:14px 8px;}
  .cover-meta .k{font-family:'Montserrat';font-size:8.5px;letter-spacing:1px;color:var(--metal);text-transform:uppercase;}
  .cover-meta .v{font-family:'Montserrat';font-size:11px;margin-top:4px;color:#fff;}

  .doc-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:9mm;}
  .dh-left{display:flex;align-items:center;gap:9px;}
  .dh-mark{width:26px;height:26px;object-fit:cover;border-radius:50%;}
  .dh-left .b{font-family:'Orbitron';font-size:12px;letter-spacing:1px;}
  .dh-left .b .x{color:var(--red);}
  .dh-left .s{font-family:'Montserrat';font-size:8px;color:var(--ink-dim);letter-spacing:.5px;}
  .dh-right{text-align:right;font-family:'Montserrat';font-size:9px;color:var(--ink-dim);line-height:1.6;}
  .dh-right b{color:var(--ink);}
  .doc-eyebrow{font-family:'Montserrat';font-size:9px;letter-spacing:1.5px;color:var(--red);text-transform:uppercase;font-weight:700;}
  .doc-body{font-family:'Montserrat';font-size:10.5px;line-height:1.8;color:var(--ink);flex:1;}
  .doc-body h2{font-family:'Montserrat';font-size:17px;font-weight:700;margin:5px 0 6mm;text-transform:uppercase;}
  .doc-body h3{font-size:11px;margin:6mm 0 2.5mm;text-transform:uppercase;border-left:3px solid var(--red);padding-left:8px;}
  .doc-body p{margin-bottom:3mm;text-align:justify;}
  .doc-body table{width:100%;border-collapse:collapse;margin:3mm 0 5mm;}
  .doc-body th{background:#f4f4f4;text-align:left;font-size:9px;text-transform:uppercase;padding:6px 8px;border:1px solid var(--hair);}
  .doc-body td{font-size:9.5px;padding:6px 8px;border:1px solid var(--hair);}
  .doc-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--hair);padding-top:8px;margin-top:auto;}
  .df-left,.df-code{font-family:'Montserrat';font-size:7.5px;color:var(--ink-dim);line-height:1.6;}
  .df-right{display:flex;align-items:center;gap:8px;}
  .qr-mini{width:32px;height:32px;background:repeating-linear-gradient(0deg,#141414 0 3.2px,#fff 3.2px 6.4px),repeating-linear-gradient(90deg,#141414 0 3.2px,transparent 3.2px 6.4px);background-blend-mode:multiply;border:3px solid #fff;}

  .auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm;margin-top:3mm;}
  .auth-block{border:1px solid var(--hair);border-radius:4px;overflow:hidden;}
  .auth-block .ab-head{background:#0a0a0a;color:#fff;font-family:'Montserrat';font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;}
  .auth-row{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--hair);font-family:'Montserrat';font-size:9px;}
  .auth-row:last-child{border-bottom:none;}
  .auth-row .k{color:var(--ink-dim);}
  .auth-row .v{font-weight:700;word-break:break-all;text-align:right;padding-left:10px;}
  .sign-block{margin-top:10mm;display:flex;gap:12mm;align-items:flex-end;}
  .sign-line{flex:1;border-top:1px solid var(--ink);padding-top:6px;font-family:'Montserrat';font-size:9px;}
  .sign-line b{display:block;font-size:10.5px;margin-bottom:2px;}
  .sign-qr{width:56px;height:56px;background:repeating-linear-gradient(0deg,#141414 0 4.6px,#fff 4.6px 9.2px),repeating-linear-gradient(90deg,#141414 0 4.6px,transparent 4.6px 9.2px);background-blend-mode:multiply;border:4px solid #fff;}

  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .page{box-shadow:none;margin:0;}
    #docView .page{page-break-after:always;}
  }
</style>
</head>

    <div class="topbar panel">
      <h1 id="pageTitle">Novo Cadastro</h1>

    </div>
    <div class="conn-status" id="connStatus"><span class="dot"></span><span id="connMsg">Conectando ao banco de dados...</span></div>

    <div class="content">
      <div id="tab-cadastro">
        <div class="card panel">
          <div class="card-head"><h2 id="formTitle">Dados do Estabelecimento</h2></div>
          <div class="form-grid">
            <div class="f-item"><label>Nome da Empresa</label><input id="f_nome" placeholder="Ex: Frigorífico Vale Forte LTDA"></div>
            <div class="f-item"><label>CNPJ</label><input id="f_cnpj" placeholder="00.000.000/0000-00"></div>
            <div class="f-item"><label>Proprietário</label><input id="f_proprietario" placeholder="Nome do proprietário"></div>
            <div class="f-item"><label>Município / Estado</label><input id="f_municipio" placeholder="Ex: Ipatinga / MG"></div>
            <div class="f-item">
              <label>Tipo de Estabelecimento</label>
              <select id="f_tipo">
                <option value="">Selecione...</option>
                <option>Abatedouro</option><option>Frigorífico</option><option>Entreposto</option>
                <option>Açougue</option><option>Agroindústria</option><option>Pet Shop</option>
              </select>
            </div>
            <div class="f-item">
              <label>Tipo de Inspeção</label>
              <select id="f_inspecao">
                <option value="">Selecione...</option>
                <option>SIF — Federal</option><option>Estadual</option><option>Municipal</option>
              </select>
            </div>
            <div class="f-item"><label>Capacidade Produtiva</label><input id="f_capacidade" placeholder="Ex: 40 toneladas/mês"></div>
            <div class="f-item"><label>Área Construída</label><input id="f_area" placeholder="Ex: 850 m²"></div>
            <div class="f-item"><label>RT Responsável</label><input id="f_rt_nome" placeholder="Ex: Dr. M. Andrade"></div>
            <div class="f-item"><label>CRMV do RT</label><input id="f_rt_crmv" placeholder="Ex: 14.203/MG"></div>
          </div>
          <div class="form-actions">
            <button class="btn-primary" id="btnSalvar" onclick="salvarCliente()">Salvar Cadastro</button>
            <button class="btn-ghost" id="btnCancelarEdicao" onclick="cancelarEdicao()" style="display:none;">Cancelar edição</button>
            <button class="btn-ghost" id="btnLimpar" onclick="limparForm()">Limpar</button>
          </div>
        </div>
      </div>

      <div id="tab-clientes" style="display:none;">
        <div class="card panel">
          <div class="card-head"><h2>Estabelecimentos Cadastrados</h2></div>
          <div class="client-tools" role="search">
            <input id="clientSearch" type="search" placeholder="Pesquisar por nome, CNPJ, município ou RT" aria-label="Pesquisar estabelecimentos" oninput="agendarBuscaClientes()">

              <option value="ativos">Ativos</option>
              <option value="arquivados">Arquivados</option>
              <option value="todos">Todos</option>

            <button class="btn-ghost" type="button" onclick="novoCadastro()">+ Novo cadastro</button>

function showToast(msg, isError){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3200);
}

function setConnStatus(state, msg){
  const el = document.getElementById('connStatus');
  el.classList.remove('ok','error');
  if(state) el.classList.add(state);
  document.getElementById('connMsg').textContent = msg;
}

// ---- AUTENTICAÇÃO ----
let authMode = 'login';
let currentUser = null;
let currentRole = 'cliente';
let canCreateDocuments = false;
let canDeleteCompanies = false;
let editingClientId = null;
let clientCache = [];
let clientPage = 0;
let clientTotal = 0;
let clientSearchTimer = null;
let clientRequestSequence = 0;
const CLIENT_PAGE_SIZE = 20;

function setAuthMode(mode){
  authMode = mode;
  document.querySelectorAll('.login-tab').forEach(el=>el.classList.toggle('active', el.dataset.mode===mode));
  document.getElementById('btnAuth').textContent = mode==='login' ? 'Entrar' : 'Criar Conta';
  document.getElementById('loginMsg').textContent = '';
}

function setLoginMsg(msg, type){
  const el = document.getElementById('loginMsg');
  el.textContent = msg;
  el.className = 'login-msg' + (type ? ' '+type : '');
}

function authErrorMessage(error){
  console.error('Falha de autenticação', error);
  if(error && error.code === 'invalid_credentials') return 'E-mail ou senha incorretos.';
  if(error && error.code === 'email_not_confirmed') return 'Confirme seu e-mail antes de entrar.';
  if(error && error.code === 'over_request_rate_limit') return 'Muitas tentativas. Aguarde alguns minutos.';
  return 'Não foi possível concluir. Tente novamente.';
}

async function handleAuth(){
  const emailInput = document.getElementById('auth_email');
  const passwordInput = document.getElementById('auth_password');
  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;
  if(!email || !email.includes('@')){ setLoginMsg('Informe um e-mail válido.', 'error'); emailInput.focus(); return; }
  if(password.length < 6){ setLoginMsg('A senha deve ter pelo menos 6 caracteres.', 'error'); passwordInput.focus(); return; }
  const btn = document.getElementById('btnAuth');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = authMode === 'login' ? 'Entrando...' : 'Criando conta...';
  setLoginMsg('');
  try {
    if(authMode === 'login'){
      const { error } = await supa.auth.signInWithPassword({ email, password });
      if(error) setLoginMsg(authErrorMessage(error), 'error');
    } else {
      const { data, error } = await supa.auth.signUp({ email, password });
      if(error) setLoginMsg(authErrorMessage(error), 'error');
      else if(!data.session) setLoginMsg('Conta criada! Confirme seu e-mail antes de entrar.', 'ok');
    }
  } catch(error){
    console.error(error);
    setLoginMsg('Falha de conexão. Tente novamente.', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

async function handleLogout(){ await supa.auth.signOut(); }

async function onAuthenticated(user){
  if(!user) return;
  const sameUser = currentUser && currentUser.id === user.id;
  currentUser = user;
  document.getElementById('userEmail').textContent = user.email || 'Usuário';
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('mainView').style.display = 'grid';

  const { data: perfil, error } = await supa.from('perfis').select('papel').eq('user_id', user.id).maybeSingle();
  if(error) console.error('Falha ao carregar perfil', error);
  currentRole = perfil ? perfil.papel : 'cliente';
  canCreateDocuments = ['administrador','rt','consultor'].includes(currentRole);
  canDeleteCompanies = currentRole === 'administrador';

  if(!sameUser) await testConnection().then(renderClientList);
}

async function initAuth(){
  if(!supa){ setLoginMsg('Serviço de autenticação indisponível.', 'error'); return; }
  supa.auth.onAuthStateChange((event, session) => {
    setTimeout(() => {
      if(session && session.user) onAuthenticated(session.user);
      else if(event === 'SIGNED_OUT'){
        currentUser = null;
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('loginView').style.display = 'flex';
      }
    }, 0);
  });
  const { data, error } = await supa.auth.getUser();
  if(error && error.name !== 'AuthSessionMissingError') console.error(error);
  if(data && data.user) await onAuthenticated(data.user);
  else {
    document.getElementById('loginView').style.display = 'flex';
    document.getElementById('mainView').style.display = 'none';
  }
}

async function testConnection(){
  if(!supa){ setConnStatus('error', 'Biblioteca do Supabase não carregou (verifique sua internet).'); return; }
  const { error } = await supa.from('empresas').select('id', { count: 'exact', head: true });
  if(error){
    setConnStatus('error', 'Falha ao conectar: ' + error.message);
  } else {
    setConnStatus('ok', 'Conectado ao banco de dados ORIGENIX');
  }
}

// ---- CRUD: empresas ----
const EMPRESA_FIELDS = 'id,nome,cnpj,email,telefone,proprietario,municipio,tipo_estabelecimento,inspecao,capacidade,area,rt_nome,rt_crmv,user_id,criado_em,atualizado_em,ativo,arquivado_em';

async function getClientes(){
  const status = document.getElementById('clientStatusFilter')?.value || 'ativos';
  const rawSearch = (document.getElementById('clientSearch')?.value || '').trim();
  const search = rawSearch.replace(/[%,()_]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
  const from = clientPage * CLIENT_PAGE_SIZE;
  const to = from + CLIENT_PAGE_SIZE - 1;
  const requestSequence = ++clientRequestSequence;

  let query = supa
    .from('empresas')
    .select(EMPRESA_FIELDS, { count: 'exact' })
    .order('criado_em', { ascending:false })
    .range(from, to);
  if(status === 'ativos') query = query.eq('ativo', true);
  if(status === 'arquivados') query = query.eq('ativo', false);
  if(search){
    const pattern = `%${search}%`;
    query = query.or(`nome.ilike.${pattern},cnpj.ilike.${pattern},municipio.ilike.${pattern},rt_nome.ilike.${pattern},tipo_estabelecimento.ilike.${pattern}`);
  }

  const { data, error, count } = await query;
  if(requestSequence !== clientRequestSequence) return null;
  if(error){
    console.error(error);
    setConnStatus('error', 'Erro ao carregar: ' + error.message);
    return [];
  }
  setConnStatus('ok', 'Conectado ao banco de dados ORIGENIX');
  clientCache = data || [];
  clientTotal = count || 0;
  return clientCache;
}

function setSavingState(active){
  const btn = document.getElementById('btnSalvar');
  if(window.OrigenixUI?.setButtonLoading){
    window.OrigenixUI.setButtonLoading(btn, active, editingClientId ? 'Atualizando...' : 'Salvando...');
  } else {
    btn.disabled = active;
    btn.textContent = active ? (editingClientId ? 'Atualizando...' : 'Salvando...') : (editingClientId ? 'Atualizar Cadastro' : 'Salvar Cadastro');
  }
}

async function salvarCliente(){
  const nome = document.getElementById('f_nome').value.trim();
  if(!nome){ showToast('Informe o nome da empresa.', true); document.getElementById('f_nome').focus(); return; }
  setSavingState(true);

  const registro = {
    nome,
    cnpj: document.getElementById('f_cnpj').value.trim() || null,
    proprietario: document.getElementById('f_proprietario').value.trim() || null,
    municipio: document.getElementById('f_municipio').value.trim() || null,
    tipo_estabelecimento: document.getElementById('f_tipo').value || null,
    inspecao: document.getElementById('f_inspecao').value || null,
    capacidade: document.getElementById('f_capacidade').value.trim() || null,
    area: document.getElementById('f_area').value.trim() || null,
    rt_nome: document.getElementById('f_rt_nome').value.trim() || null,
    rt_crmv: document.getElementById('f_rt_crmv').value.trim() || null,
    atualizado_em: new Date().toISOString()
  };
  if(!editingClientId) registro.user_id = currentUser ? currentUser.id : null;

  const request = editingClientId
    ? supa.from('empresas').update(registro).eq('id', editingClientId)
    : supa.from('empresas').insert(registro);
  const { error } = await request;
  setSavingState(false);

  if(error){
    console.error(error);
    showToast('Erro ao salvar: ' + error.message, true);
    return;
  }
  const wasEditing = Boolean(editingClientId);
  cancelarEdicao(false);
  showToast(wasEditing ? 'Cadastro atualizado com sucesso.' : 'Estabelecimento cadastrado com sucesso.');
  switchTab('clientes');
}

function limparForm(){
  ['f_nome','f_cnpj','f_proprietario','f_municipio','f_capacidade','f_area','f_rt_nome','f_rt_crmv'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f_tipo').value='';
  document.getElementById('f_inspecao').value='';
}

function cancelarEdicao(showMessage=true){
  editingClientId = null;
  limparForm();
  document.getElementById('formTitle').textContent = 'Dados do Estabelecimento';
  document.getElementById('btnSalvar').textContent = 'Salvar Cadastro';
  document.getElementById('btnCancelarEdicao').style.display = 'none';
  document.getElementById('btnLimpar').style.display = '';
  if(showMessage) showToast('Edição cancelada.');
}

function novoCadastro(){
  cancelarEdicao(false);
  switchTab('cadastro');
  document.getElementById('f_nome').focus();
}

function editarCliente(id){
  const cliente = clientCache.find(item=>item.id===id);
  if(!cliente){ showToast('Cadastro não encontrado. Atualize a lista.', true); return; }
  editingClientId = id;
  const values = {
    f_nome:cliente.nome, f_cnpj:cliente.cnpj, f_proprietario:cliente.proprietario,
    f_municipio:cliente.municipio, f_tipo:cliente.tipo_estabelecimento,
    f_inspecao:cliente.inspecao, f_capacidade:cliente.capacidade, f_area:cliente.area,
    f_rt_nome:cliente.rt_nome, f_rt_crmv:cliente.rt_crmv
  };
  Object.entries(values).forEach(([field,value])=>document.getElementById(field).value=value||'');
  document.getElementById('formTitle').textContent = 'Editar Estabelecimento';
  document.getElementById('btnSalvar').textContent = 'Atualizar Cadastro';
  document.getElementById('btnCancelarEdicao').style.display = '';
  document.getElementById('btnLimpar').style.display = 'none';
  switchTab('cadastro');
  document.getElementById('f_nome').focus();
}

function switchTab(tab){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const nav = document.querySelector(`.nav-item[data-tab="${tab}"]`);
  if(nav) nav.classList.add('active');
  document.getElementById('tab-cadastro').style.display = tab==='cadastro' ? 'block':'none';
  document.getElementById('tab-clientes').style.display = tab==='clientes' ? 'block':'none';
  document.getElementById('pageTitle').textContent = tab==='cadastro' ? (editingClientId ? 'Editar Cadastro' : 'Novo Cadastro') : 'Clientes Cadastrados';
  document.getElementById('pageSub').textContent = tab==='cadastro' ? (editingClientId ? 'Atualize os dados operacionais do estabelecimento' : 'Fase 1 — Triagem do estabelecimento') : 'Pesquise, edite, emita ou arquive estabelecimentos';
  if(tab==='clientes') renderClientList();
}
document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', ()=>switchTab(el.dataset.tab));
});

function agendarBuscaClientes(){
  window.clearTimeout(clientSearchTimer);
  clientSearchTimer = window.setTimeout(reiniciarListaClientes, 320);
}

function reiniciarListaClientes(){
  clientPage = 0;
  renderClientList();
}

function mudarPaginaClientes(nextPage){
  const pageCount = Math.max(1, Math.ceil(clientTotal / CLIENT_PAGE_SIZE));
  if(nextPage < 0 || nextPage >= pageCount || nextPage === clientPage) return;
  clientPage = nextPage;
  renderClientList();
  document.getElementById('clientSearch')?.focus({ preventScroll:true });
}

function renderClientRows(list){
  const container = document.getElementById('clientList');
  const summary = document.getElementById('clientResultsSummary');
  const pagination = document.getElementById('clientPagination');
  const first = clientTotal ? (clientPage * CLIENT_PAGE_SIZE) + 1 : 0;
  const last = Math.min((clientPage + 1) * CLIENT_PAGE_SIZE, clientTotal);
  const pageCount = Math.max(1, Math.ceil(clientTotal / CLIENT_PAGE_SIZE));
  document.getElementById('clientCount').textContent = clientTotal;
  summary.textContent = clientTotal
    ? `Exibindo ${first}–${last} de ${clientTotal} estabelecimento${clientTotal === 1 ? '' : 's'}`
    : 'Nenhum estabelecimento encontrado';

  if(list.length===0){
    const hasSearch = Boolean(document.getElementById('clientSearch')?.value.trim());
    container.innerHTML = `<div class="empty-state">${hasSearch ? 'Nenhum estabelecimento corresponde à pesquisa.' : 'Nenhum estabelecimento nesta situação.'}</div>`;
  } else {
    container.innerHTML = list.map(c=>`
      <div class="client-row ${c.ativo ? '' : 'archived'}">
        <div class="info">
          <b>${escapeHtml(c.nome)}</b>
          <span>${escapeHtml(c.tipo_estabelecimento||'—')} · ${escapeHtml(c.municipio||'—')} · RT: ${escapeHtml(c.rt_nome||'—')}</span>
          <small class="status-badge">${c.ativo ? 'Ativo' : 'Arquivado'}</small>
        </div>
        <div class="actions">
          ${c.ativo ? `<button class="mini-btn edit" onclick="editarCliente('${c.id}')">Editar</button>` : ''}
          ${c.ativo && canCreateDocuments ? `<button class="mini-btn emit" onclick="gerarDocumento('${c.id}')">Gerar documento</button>` : ''}
          ${canDeleteCompanies ? (c.ativo
            ? `<button class="mini-btn danger" onclick="alterarSituacaoCliente('${c.id}', false)">Arquivar</button>`
            : `<button class="mini-btn" onclick="alterarSituacaoCliente('${c.id}', true)">Restaurar</button>`) : ''}
        </div>
      </div>
    `).join('');
  }

  pagination.innerHTML = pageCount > 1 ? `
    <button class="mini-btn" type="button" onclick="mudarPaginaClientes(${clientPage-1})" ${clientPage===0 ? 'disabled' : ''} aria-label="Página anterior">← Anterior</button>
    <span>Página <b>${clientPage+1}</b> de ${pageCount}</span>
    <button class="mini-btn" type="button" onclick="mudarPaginaClientes(${clientPage+1})" ${clientPage>=pageCount-1 ? 'disabled' : ''} aria-label="Próxima página">Próxima →</button>
  ` : '';
}

async function renderClientList(){
  const container = document.getElementById('clientList');
  container.setAttribute('aria-busy', 'true');
  container.innerHTML = '<div class="empty-state">Carregando estabelecimentos...</div>';
  const list = await getClientes();
  container.setAttribute('aria-busy', 'false');
  if(list === null) return;
  renderClientRows(list);
}

async function alterarSituacaoCliente(id, restaurar){
  const cliente = clientCache.find(item=>item.id===id);
  if(!cliente) return;
  const title = restaurar ? 'Restaurar estabelecimento?' : 'Arquivar estabelecimento?';
  const description = restaurar
    ? `${cliente.nome} voltará a aparecer nas rotinas operacionais.`
    : `${cliente.nome} será removido das rotinas sem perder documentos ou histórico.`;
  const confirmed = window.OrigenixUI?.openFormDialog
    ? await window.OrigenixUI.openFormDialog({
        title, description, fields:[],
        confirmLabel: restaurar ? 'Restaurar' : 'Arquivar',
        danger: !restaurar
      })
    : (window.confirm(description) ? {} : null);
  if(!confirmed) return;

  const { error } = await supa.from('empresas').update({
    ativo: restaurar,
    arquivado_em: restaurar ? null : new Date().toISOString(),
    atualizado_em: new Date().toISOString()
  }).eq('id', id);
  if(error){ showToast('Não foi possível alterar a situação: ' + error.message, true); return; }
  await renderClientList();
  showToast(restaurar ? 'Estabelecimento restaurado.' : 'Estabelecimento arquivado com segurança.');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str||'';
  return d.innerHTML;
}

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function gerarDocumento(clientId){
  if(!canCreateDocuments){ showToast('Seu perfil não possui permissão para emitir documentos.', true); return; }
  let cliente = clientCache.find(c=>c.id===clientId);
  if(!cliente){
    const { data, error } = await supa.from('empresas').select(EMPRESA_FIELDS).eq('id', clientId).single();
    if(error || !data){ showToast('Não foi possível carregar o estabelecimento.', true); return; }
    cliente = data;

  const { data: codigo, error: codigoError } = await supa.rpc('proximo_codigo_documento', {
    empresa_id: cliente.id,
    tipo_codigo: 'PA-01'

    console.error(codigoError);
    showToast('Não foi possível reservar a numeração do documento.', true);

  const uuid = crypto.randomUUID();
  const now = new Date();

  const hash = await sha256(conteudoParaHash);
  const hashShort = hash.slice(0,8) + '...' + hash.slice(-6);

  const { data: documento, error: docError } = await supa.from('documentos').insert({

    <div class="page-inner">
