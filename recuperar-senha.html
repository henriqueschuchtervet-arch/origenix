<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORIGENIX — Recuperar senha</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" data-supabase-version="2.111.0" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="origenix-supabase.js?v=1.0"></script>
  <style>
    :root { color-scheme: dark; --red:#d10000; --accent:#ff1a1a; --metal:#aaa; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
      background:#000; color:#fff; font:14px Inter,system-ui,sans-serif; }
    main { width:min(420px,100%); padding:30px; border:1px solid rgba(255,45,45,.25);
      border-radius:14px; background:#121214; box-shadow:0 24px 70px rgba(0,0,0,.6); }
    h1 { margin:0 0 8px; font-size:22px; }
    p { color:var(--metal); line-height:1.55; }
    label { display:block; margin:20px 0 7px; font-size:12px; color:var(--metal); }
    input { width:100%; padding:12px 13px; border:1px solid rgba(255,45,45,.25);
      border-radius:9px; background:#080808; color:#fff; font:inherit; }
    input:focus { outline:2px solid var(--accent); outline-offset:2px; }
    button { width:100%; margin-top:16px; padding:13px; border:0; border-radius:9px;
      background:linear-gradient(135deg,#8b0000,var(--accent)); color:#fff;
      font-weight:700; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    #message { min-height:20px; margin-top:14px; font-size:13px; }
    .error { color:#ff7070; } .success { color:#66d391; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main>
  <section id="requestView">
    <h1>Recuperar senha</h1>
    <p>Informe seu e-mail. Se existir uma conta, enviaremos um link seguro para criar uma nova senha.</p>
    <form id="requestForm">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>
      <button id="requestButton" type="submit">Enviar link de recuperação</button>
    </form>
  </section>

  <section id="updateView" hidden>
    <h1>Criar nova senha</h1>
    <p>Use pelo menos 12 caracteres e evite senhas utilizadas em outros serviços.</p>
    <form id="updateForm">
      <label for="password">Nova senha</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="passwordConfirm">Confirmar nova senha</label>
      <input id="passwordConfirm" type="password" autocomplete="new-password" minlength="12" required>
      <button id="updateButton" type="submit">Atualizar senha</button>
    </form>
  </section>

  <div id="message" role="status" aria-live="polite"></div>
</main>

<script>
const supa = window.OrigenixSupabase.createClient();
const requestView = document.getElementById('requestView');
const updateView = document.getElementById('updateView');
const message = document.getElementById('message');

function showMessage(text, type = '') {
  message.textContent = text;
  message.className = type;
}

function showUpdateForm() {
  requestView.hidden = true;
  updateView.hidden = false;
  showMessage('');
}

supa.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') showUpdateForm();
});

document.getElementById('requestForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = document.getElementById('requestButton');
  button.disabled = true;
  showMessage('Enviando...');
  const email = document.getElementById('email').value.trim();
  const redirectTo = new URL('recuperar-senha.html', window.location.href).href;
  const { error } = await supa.auth.resetPasswordForEmail(email, { redirectTo });
  button.disabled = false;
  if (error) {
    showMessage('Não foi possível enviar o link. Tente novamente em instantes.', 'error');
    return;
  }
  showMessage('Se existir uma conta para esse e-mail, o link será enviado.', 'success');
});

document.getElementById('updateForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const password = document.getElementById('password').value;
  const confirmation = document.getElementById('passwordConfirm').value;
  if (password !== confirmation) {
    showMessage('As senhas não coincidem.', 'error');
    return;
  }
  const button = document.getElementById('updateButton');
  button.disabled = true;
  showMessage('Atualizando...');
  const { error } = await supa.auth.updateUser({ password });
  button.disabled = false;
  if (error) {
    showMessage('O link pode ter expirado. Solicite uma nova recuperação.', 'error');
    return;
  }
  showMessage('Senha atualizada. Você já pode entrar no ORIGENIX.', 'success');
});
</script>
<script src="ui-enhancements.js"></script>
</body>
</html>
